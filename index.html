<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#fff5f7"><title>Saúde da Batatinha</title><style>
*{box-sizing:border-box}body{margin:0;background:#fff5f7;color:#432d38;font:16px system-ui,sans-serif;line-height:1.5}main{max-width:850px;margin:auto;padding:20px}header{background:linear-gradient(125deg,#ffe1e7,#f1e6ff);padding:32px;border-radius:28px;margin-bottom:20px}h1{font-size:clamp(28px,5vw,42px);line-height:1.1;margin:12px 0}h2{font-size:21px;margin-top:0}small,.muted{color:#735b67}nav{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}a{color:#9b315b}nav a{background:white;border-radius:14px;padding:10px 15px;text-decoration:none;font-weight:600}.card{background:white;border:1px solid #efdee5;border-radius:22px;padding:22px;margin:16px 0;box-shadow:0 5px 20px #6f284509}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.tip{background:#faf6ff;border-radius:16px;padding:16px}.alert{background:#fff0ed;border:1px solid #e9a29b;border-radius:20px;padding:20px;color:#762d2d}label{display:block;margin:12px 0 6px;font-weight:600}input,select,textarea,button{font:inherit}select,textarea,input:not([type=checkbox]){width:100%;padding:12px;border:1px solid #decbd6;border-radius:12px;background:#fffbfd;color:#432d38}textarea{resize:vertical}button,.btn{border:0;background:#a83c65;color:white;padding:12px 18px;border-radius:12px;font-weight:650;cursor:pointer;text-decoration:none;display:inline-block}button.secondary{background:#f4e8ee;color:#79324e}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #8e4baf;outline-offset:3px}.checks{display:flex;flex-wrap:wrap;gap:8px}.checks label{font-weight:400;background:#fff5f7;padding:9px 12px;border-radius:12px;margin:0}fieldset{border:0;padding:0;margin:18px 0}legend{font-weight:600;margin-bottom:8px}.entry{border-top:1px solid #f0e4e9;padding:14px 0;overflow-wrap:anywhere}.entry p{white-space:pre-wrap;margin:7px 0}.barrow{display:grid;grid-template-columns:105px 1fr;align-items:center;gap:10px;margin:10px 0}.bar{background:#f4e8ee;border-radius:10px;height:16px;overflow:hidden}.fill{background:#b4557c;height:100%;border-radius:10px}footer{text-align:center;padding:20px;color:#735b67}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}#status{min-height:24px} @media(max-width:480px){main{padding:12px}.card,header{padding:19px}}
</style></head><body><main><header><small>🌷 SEU CANTINHO DE CUIDADO</small><h1>Saúde da Batatinha 🥔💕</h1></header></main></body></html>
